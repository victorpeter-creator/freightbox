<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FOS - Settings</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans antialiased text-gray-900">
    
    <nav class="bg-white shadow-sm mb-8 px-6 py-4 flex justify-between items-center">
        <div class="font-bold text-xl text-blue-600">FOS System</div>
        <div class="flex items-center space-x-4">
            <a href="/dashboard" class="text-sm text-blue-600 hover:underline font-semibold">Dashboard</a>
            <span class="text-sm text-gray-600 border-l pl-4 border-gray-300">Logged in as: <strong>{{ current_user.name }}</strong></span>
            <a href="/logout" class="text-sm bg-gray-200 hover:bg-gray-300 text-gray-800 py-2 px-4 rounded-md transition duration-300">Logout</a>
        </div>
    </nav>

    <div class="max-w-xl mx-auto bg-white p-8 rounded-xl shadow-lg mb-10">
        <h2 class="text-2xl font-bold text-gray-800 mb-6">Company Settings</h2>
        
        <form method="POST" action="/settings" enctype="multipart/form-data" class="space-y-6">
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Update Company Logo (PNG/JPG)</label>
                <div class="mt-1 flex justify-center px-6 pt-5 pb-6 border-2 border-gray-300 border-dashed rounded-md">
                    <div class="space-y-1 text-center">
                        <svg class="mx-auto h-12 w-12 text-gray-400" stroke="currentColor" fill="none" viewBox="0 0 48 48">
                            <path d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8m-12 4h.02" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                        <div class="flex text-sm text-gray-600">
                            <label class="relative cursor-pointer bg-white rounded-md font-medium text-blue-600 hover:text-blue-500 focus-within:outline-none">
                                <span>Upload a file</span>
                                <input type="file" name="logo" class="sr-only" accept=".png, .jpg, .jpeg">
                            </label>
                        </div>
                    </div>
                </div>
                {% if current_user.logo_filename %}
                    <p class="text-xs text-green-600 mt-2">✓ Logo is currently uploaded.</p>
                {% endif %}
            </div>

            <div class="pt-4 border-t border-gray-200">
                <button type="submit" class="w-full bg-blue-600 text-white py-2 px-4 rounded-md shadow-sm hover:bg-blue-700 font-semibold transition duration-300">
                    Save Settings
                </button>
            </div>
        </form>
    </div>
</body>
</html>
